version: "3.9"

services:
  runtimes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tcc-react
    working_dir: /casos/react
    volumes:
      - .:/casos/react
    ports:
      - "5173:5173"
    tty: true
    stdin_open: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
