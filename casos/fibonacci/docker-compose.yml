version: "3.9"

services:
  runtimes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tcc-fibonacci
    working_dir: /casos/fibonacci
    volumes:
      - .:/casos/fibonacci
    tty: true
    stdin_open: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
